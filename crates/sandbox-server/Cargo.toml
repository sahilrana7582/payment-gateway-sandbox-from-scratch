[package]
name    = "sandbox-server"
version = "0.1.0"
edition = {workspace = true}

[[bin]]
name = "sandbox-server"
path = "src/main.rs"

[dependencies]
domain             = { path = "../domain", features = ["db"] }
store              = { path = "../store" }
crypto             = { path = "../crypto" }
queue              = { path = "../queue" }
webhooks           = { path = "../webhooks" }
api                = { path = "../api" }
axum               = {workspace = true}
anyhow             = {workspace = true}
tokio              = {workspace = true}
tokio-util         = {workspace = true}
tracing            = {workspace = true}
tracing-subscriber = {workspace = true}
envconfig          = {workspace = true}
dotenvy            = "0.15"
time               = {workspace = true}

[lints.rust]
unsafe_code = "forbid"