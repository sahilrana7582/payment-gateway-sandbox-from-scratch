[package]
name    = "api"
version = "0.1.0"
edition = {workspace = true}

[lib]
path = "lib.rs"

[dependencies]
domain     = { path = "../domain", features = ["db"] }
store      = { path = "../store" }
engine     = { path = "../engine" }
simulator  = { path = "../simulator" }
crypto     = { path = "../crypto" }
axum       = {workspace = true}
tower      = {workspace = true}
tower-http = { workspace = true, features = [
    "trace",
    "cors",
    "catch-panic",
    "sensitive-headers",
] }
tokio      = {workspace = true}
serde      = {workspace = true}
serde_json = {workspace = true}
sqlx       = {workspace = true}
time       = {workspace = true}
thiserror  = {workspace = true}
tracing    = {workspace = true}
uuid       = {workspace = true}
url        = "2"

[dev-dependencies]
tower          = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"
