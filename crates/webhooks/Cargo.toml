[package]
name    = "webhooks"
version = "0.1.0"
edition = {workspace = true}

[lib]
path = "lib.rs"

[dependencies]
domain     = { path = "../domain", features = ["db"] }
store      = { path = "../store" }
queue      = { path = "../queue" }
crypto     = { path = "../crypto" }
reqwest    = {workspace = true}
tokio      = {workspace = true}
serde      = {workspace = true}
serde_json = {workspace = true}
sqlx       = {workspace = true}
time       = {workspace = true}
thiserror  = {workspace = true}
tracing    = {workspace = true}
uuid       = {workspace = true}

[dev-dependencies]
engine   = { path = "../engine" }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
