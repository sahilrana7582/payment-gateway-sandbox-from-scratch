[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/store",
    ]

[workspace.package]
edition = "2021"


[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
uuid        = { version = "1", features = ["v7", "serde"] }
time        = { version = "0.3", features = ["serde", "macros"] }
thiserror   = "1"
serde_json  = "1"
rstest      = "0.23"
proptest    = "1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "time",
    "json",
    "rust_decimal",
    "derive",
    "migrate",
    "macros"
] }
