[workspace]
resolver = "2"
members = [
    "crates/domain"
    ]


[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
uuid        = { version = "1", features = ["v7", "serde"] }
time        = { version = "0.3", features = ["serde", "macros"] }
thiserror   = "1"
serde_json  = "1"
rstest      = "0.23"
proptest    = "1"
