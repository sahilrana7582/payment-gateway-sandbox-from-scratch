[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/store",
    "crates/crypto",
    "crates/queue",
    "crates/simulator",
    "crates/engine",
    "crates/webhooks",
    "crates/api",
    ]

[workspace.package]
edition = "2021"


[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
uuid        = { version = "1", features = ["v7", "serde"] }
time        = { version = "0.3", features = ["serde", "macros"] }
thiserror   = "1"
serde_json  = "1"
rstest      = "0.23"
proptest    = "1"
argon2      = "0.5"
hmac        = "0.12"
sha2        = "0.10"
aes-gcm     = "0.10"
rand        = "0.8"
hex         = "0.4"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing     = "0.1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum        = "0.7"
tower       = "0.5"
tower-http  = "0.7.0"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "time",
    "json",
    "rust_decimal",
    "derive",
    "migrate",
    "macros"
] }
